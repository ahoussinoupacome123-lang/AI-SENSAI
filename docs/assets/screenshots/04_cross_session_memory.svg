  <text x="430" y="23" fill="#8b949e" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Terminal – Cross-Session Recall & Second Brain (Feature M3 - 2 Stars)</text>
  <g>
    <text x="24" y="70" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">$ python3 -m src.chat</text><text x="24" y="91" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Chatting with qwen3:4b. Type 'exit' or Ctrl+D to quit; Ctrl+C cancels a reply.</text><text x="24" y="112" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Commands: /edit &lt;text&gt;, /history, /branches, /switch &lt;n&gt;, /memory, /recall &lt;query&gt;.</text><text x="24" y="133" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"></text><text x="24" y="154" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">you&gt; /memory</text><text x="24" y="175" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">2 stored memory session(s):</text><text x="24" y="196" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"> - [cli_1793291743] What is an IP address in one sentenc (4 turns)</text><text x="24" y="217" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"> - [cli_1793288232] What is an IPv6 address in one sente (2 turns)</text><text x="24" y="238" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"></text><text x="24" y="259" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">you&gt; What did we say about the Ethernet frame payload in our earlier chat?</text><text x="24" y="280" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">bot&gt; (thinking...) In our earlier chat, we specifically stated that the maximum payload size for a standard Ethernet frame (IEEE 802.3) is 1500 bytes. We also noted that jumbo frames (up to 9000 bytes) are an exception used in specific high-speed networks but are not part of the standard Ethernet definition.</text><text x="24" y="301" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"></text><text x="24" y="322" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">you&gt; exit</text>
  </g>
