<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="100%" height="auto">
  <rect width="860" height="420" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect width="860" height="38" rx="10" fill="#161b22"/>
  <rect y="28" width="860" height="10" fill="#161b22"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="19" r="6" fill="#27c93f"/>
  <text x="430" y="23" fill="#8b949e" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Terminal – General Knowledge Fallback & Math (Feature D6)</text>
  <g>
    <text x="24" y="70" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">$ python3 -m src.chat</text><text x="24" y="91" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Chatting with qwen3:4b. Type 'exit' or Ctrl+D to quit; Ctrl+C cancels a reply.</text><text x="24" y="112" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Commands: /edit &lt;text&gt;, /history, /branches, /switch &lt;n&gt;, /memory, /recall &lt;query&gt;.</text><text x="24" y="133" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"></text><text x="24" y="154" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">you&gt; How much is 19 - 5 ?</text><text x="24" y="175" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">bot&gt; (thinking...) 19 - 5 = 14</text><text x="24" y="196" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"></text><text x="24" y="217" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">you&gt; Hello, what is your role?</text><text x="24" y="238" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">bot&gt; (thinking...) I am Qwen, a large language model developed by Tongyi Lab. I can help with answering questions, writing text, coding, and more.</text><text x="24" y="259" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"></text><text x="24" y="280" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">you&gt; exit</text>
  </g>
</svg>