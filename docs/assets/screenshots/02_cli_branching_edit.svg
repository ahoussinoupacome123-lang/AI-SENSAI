<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 530" width="100%" height="auto">
  <rect width="820" height="530" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect width="820" height="38" rx="10" fill="#161b22"/>
  <rect y="28" width="820" height="10" fill="#161b22"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="19" r="6" fill="#27c93f"/>
  <text x="410" y="23" fill="#8b949e" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Terminal – Sensai Branching & Resume (Feature X2 - 2 Stars)</text>
  <g>
    <text x="24" y="70" fill="#58a6ff" font-family="ui-monospace, monospace" font-size="13.5">$ python src/chat.py qwen3:4b</text><text x="24" y="92" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13.5">Chatting with qwen3:4b. Type 'exit' to quit.</text><text x="24" y="114" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13.5">Commands: /edit &lt;text&gt;, /history, /branches, /switch &lt;n&gt;, /memory, /recall &lt;query&gt;.</text><text x="24" y="136" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13.5"></text><text x="24" y="158" fill="#58a6ff" font-family="ui-monospace, monospace" font-size="13.5">you&gt; What is 2 + 2?</text><text x="24" y="180" fill="#d2a8ff" font-family="ui-monospace, monospace" font-size="13.5">bot&gt; 2 + 2 = 4.</text><text x="24" y="202" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13.5"></text><text x="24" y="224" fill="#58a6ff" font-family="ui-monospace, monospace" font-size="13.5">you&gt; And 3 + 3?</text><text x="24" y="246" fill="#d2a8ff" font-family="ui-monospace, monospace" font-size="13.5">bot&gt; 3 + 3 = 6.</text><text x="24" y="268" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13.5"></text><text x="24" y="290" fill="#58a6ff" font-family="ui-monospace, monospace" font-size="13.5">you&gt; /edit 1 What is 10 + 10?</text><text x="24" y="312" fill="#d2a8ff" font-family="ui-monospace, monospace" font-size="13.5">[Branch created: editing turn 1]</text><text x="24" y="334" fill="#d2a8ff" font-family="ui-monospace, monospace" font-size="13.5">bot&gt; 10 + 10 = 20.</text><text x="24" y="356" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13.5"></text><text x="24" y="378" fill="#58a6ff" font-family="ui-monospace, monospace" font-size="13.5">you&gt; /branches</text><text x="24" y="400" fill="#d2a8ff" font-family="ui-monospace, monospace" font-size="13.5">[Branch 1] 5 messages (last user: 'And 3 + 3?')</text><text x="24" y="422" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="13.5"></text><text x="24" y="444" fill="#58a6ff" font-family="ui-monospace, monospace" font-size="13.5">you&gt; /switch 1</text><text x="24" y="466" fill="#d2a8ff" font-family="ui-monospace, monospace" font-size="13.5">[Switched to branch 1]</text><text x="24" y="488" fill="#58a6ff" font-family="ui-monospace, monospace" font-size="13.5">you&gt; /history</text><text x="24" y="510" fill="#d2a8ff" font-family="ui-monospace, monospace" font-size="13.5">[1] What is 2 + 2?</text><text x="24" y="532" fill="#d2a8ff" font-family="ui-monospace, monospace" font-size="13.5">[2] And 3 + 3?</text>
  </g>
</svg>