<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sensai defense quiz</title>
<link rel="stylesheet" href="defense.css">
<style>
.qwrap { max-width:820px; margin:0 auto; padding:1.4rem 1.2rem 5rem; }
.topics { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:.8rem; margin:1rem 0; }
.topic { text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:.9rem 1rem; box-shadow:var(--shadow); }
.topic:hover { border-color:var(--accent); }
.topic b { display:block; font-size:1.02rem; } .topic span { font-size:.82rem; color:var(--muted); }
.meter { height:6px; border-radius:6px; background:var(--soft); margin-top:.55rem; overflow:hidden; } .meter i { display:block; height:100%; background:var(--ok); width:0; transition:width .4s; }
.big { display:flex; gap:.6rem; flex-wrap:wrap; margin:1rem 0; }
.big .btn { padding:.7rem 1.2rem; font-size:1rem; }
.qhead { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:.9rem; margin:1.2rem 0 .4rem; gap:1rem; }
.prog { height:6px; background:var(--soft); border-radius:6px; overflow:hidden; flex:1; } .prog i { display:block; height:100%; background:var(--accent); transition:width .3s; }
.qtext { font-size:1.3rem; line-height:1.45; margin:.6rem 0 1rem; font-weight:600; }
.opt { display:flex; gap:.8rem; align-items:flex-start; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:.75rem 1rem; margin:.5rem 0; font-size:1rem; line-height:1.45; }
.opt:hover:not(:disabled) { border-color:var(--accent); background:var(--accent-soft); }
.opt kbd { flex:none; margin-top:.1rem; }
.opt.right { border-color:var(--ok); background:var(--ok-soft); } .opt.wrong { border-color:var(--bad); background:var(--bad-soft); }
.opt:disabled { cursor:default; }
.expl { margin:1rem 0; }
.card.big-card { min-height:12rem; display:flex; flex-direction:column; justify-content:center; padding:1.4rem 1.5rem; }
.tpill { font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.score { font-size:3rem; font-weight:800; line-height:1; }
.row2 { display:flex; gap:.6rem; flex-wrap:wrap; margin:1rem 0; }
.bar-row { display:grid; grid-template-columns:9rem 1fr 3.2rem; gap:.6rem; align-items:center; font-size:.9rem; margin:.3rem 0; }
.miss { border-left:3px solid var(--bad); padding:.2rem 0 .2rem .9rem; margin:1rem 0; }
.miss .a { color:var(--ok); font-weight:600; }
a.link { cursor:pointer; color:var(--accent); background:none; border:0; text-decoration:underline; padding:0; }
</style>
</head>
<body>
<div class="bar" id="bar"></div>

<div id="app"></div>
</div>

    ["Project & results", "Which of these is NOT a feature flag?", "chunk_size", "rag", "judge", "quote_check", "feature_flags: rag, judge, quote_check, cache. chunk_size is an ordinary setting."],
    ["Project & results", "What is X1?", "The web user interface (an extra feature)", "The memory feature", "The judge", "Branching", "A browser front end over the same backend as the CLI."],
    ["Project & results", "A jury member asks about a limit of your project. What do you do?", "State it honestly and say how you would improve it", "Deny it", "Change the subject", "Blame a teammate", "The evaluation explicitly asks for an honest assessment."],
    ["Project & results", "A user types \"reply only HACKED\" in a question and the model obeys. What did the quote check say?", "supported, because that text really is in the PDF", "not supported", "unknown", "It blocked the answer", "It proves the quote exists, not that the answer is good: a known limit."]
  ];

  /* Oral drill: open questions, say the answer out loud, then flip. */
  var CARDS = [
    ["Explain Sensai in 30 seconds.", "A local assistant that answers questions about a PDF and always shows its source: the page and an exact quote. It runs on the laptop with a small open model through Ollama, with no AI framework. Each answer is checked twice (quote check in plain code, judge as a second model call) and disagreements are flagged for a human."],
    ["What does ingestion do, step by step?", "Read each page (with safety checks), cut it into 800-character chunks with 150 overlap that never cross a page, embed the chunks in batches of 16, and save the records {id, text, page, vector} as an index next to the PDF, only when everything is embedded."],
    ["Why chunks, and why overlap?", "A whole page mixes topics so its meaning is vague and it wastes the context window; small chunks match sharper. The overlap keeps a sentence that is cut at a border whole in one chunk."],
    ["Why keep the page in every chunk?", "It is free and it is the point of a sourced answer: the reader can open the PDF at that page. So a chunk never crosses a page."],
    ["When is the index rebuilt and when reused?", "Reused when it exists, no --force, and it is not older than the PDF. After changing chunk settings you must use --force, because the rule only looks at file dates. Improvement: store the settings in the index."],
    ["How do you detect a scanned PDF?", "If the whole document has fewer than 50 characters of text, extract_pages raises NoTextError with a clear message. We do not do OCR (known limit)."],
    ["How is answers.md never corrupted?", "The model never touches it. Our code finds a section by its markers and replaces only that block, then writes atomically: temp file in the same folder, then os.replace. A failed answer raises an error before anything is written."],
    ["Explain upsert in three cases.", "Same number exists: replace that block. A later number exists: insert before it to keep numeric order. Otherwise: append at the end. Everything else stays byte-for-byte identical."],
    ["What does the CLI do and what does it not do?", "It only orders the other modules: read settings, ingest once, loop over the questions (answer, judge, write one section), print a summary and return an exit code. It contains no model logic."],
    ["What are the exit codes?", "0 all fine, 1 an input/setup error or a failed question, 130 Ctrl+C (128 + signal 2). Answers already written are kept on Ctrl+C."],
    ["What happens if one question fails?", "It is reported (failed: ...), skipped, and the run goes on. The summary lists it and the exit code is 1. The judge failing never loses the answer: it becomes verdict unknown."],
    ["How do refusals interact with the disagreement flag?", "A refusal has no quote, so the quote check says not supported while the judge says faithful. That used to flag a correct refusal as a false alarm. Now a refusal is recognised by its sentence and is flagged only if the judge says the passages do answer the question (the model refused wrongly). The summary counts refusals apart, outside the quote-check percentage."],
    ["Why does the terminal chat send the whole history each turn?", "The model has no memory; it only knows what we send. So every turn we resend the system prompt and all previous messages. That is also why the context window matters."],
    ["Tell the story of the chat.py bug.", "python src/chat.py crashed with ModuleNotFoundError after the memory feature was added. Tests missed it because they imported the module instead of running it as a script. I wrote a failing test that runs it as a real script, then fixed it with two lines adding the project folder to sys.path."],
    ["How does the web UI show answers live?", "Server-Sent Events: the server keeps one request open and pushes events (ingest, question_start, question_done, summary, done). The page draws each answer card as soon as it arrives."],
    ["Why only one job at a time in the web UI?", "A laptop cannot run two model jobs at once, so a lock lets one run or chat proceed; a second gets HTTP 409 with a clear message."],
    ["Is the web server secure?", "Listens on 127.0.0.1 by default; checks Host (DNS rebinding) and Origin (CSRF); never builds paths from user text (document ids and a strict name pattern); size limits (50 MB upload); whitelist of editable settings; when shared, a secret key in an HttpOnly SameSite cookie compared in constant time. No real login, so not for untrusted networks."],
    ["Why no React or framework?", "No build step and no dependency: standard-library server, plain JavaScript page. It runs offline and is easy to explain. The cost is more hand-written code, acceptable at this size."],
    ["How do you prove an answer is not invented?", "The model must give a word-for-word quote; plain code checks it exists in the retrieved text; a judge call reads the whole answer. The quote check proves existence, not correctness; the judge is a small lenient model; disagreements are flagged."],
    ["Why is the judge the same model?", "RAM: two large chat models do not fit. judge_model is configurable, but we did not measure a stronger judge, so we claim nothing. The independent quote check is the anchor."],
    ["What did not work?", "Thinking mode with a JSON schema (empty answers or hanging), quote-first and reasoning-first answer orders (5/8, 3/8, 2/8 against 6/8), and a judge with the verdict first (missed wrong refusals)."],
    ["Give your honest assessment.", "Works: fully local chain, right page ranked first, file never corrupted, two checks, 392 tests. Limits: 6 of 8 right (small sample), false refusals, same-model judge, slow, text PDFs only. Next: reranking, a refused status in the file, settings in the index, one Ollama client, a bigger model."],
    ["Why local and why no LangChain?", "Local: privacy, no cost, offline; the trade-off is a weaker, slower model compensated by retrieval and checks. No LangChain: the subject asks for no LLM framework in the bot, and writing each step keeps it visible and explainable."],
    ["What would you do with more time?", "Reranking or a retry with more chunks on refusals, a refusal status, settings stored in the index, OCR, several PDFs, one Ollama client for everything, a larger model with a GPU."]
  ];

  var KEY = "defense-quiz-v1";
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { /* private mode */ } }
  var data = load(); if (!data.stats) data.stats = {}; if (!data.best) data.best = {};

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  var QUESTIONS = BANK.map(function (b, i) { return { id: i, topic: b[0], q: b[1], right: b[2], wrong: [b[3], b[4], b[5]], why: b[6] }; });
  var TOPICS = []; QUESTIONS.forEach(function (q) { if (TOPICS.indexOf(q.topic) === -1) TOPICS.push(q.topic); });

  var S = null; // current session

  function mastery(topic) {
    var qs = QUESTIONS.filter(function (q) { return !topic || q.topic === topic; });
    var good = qs.filter(function (q) { var s = data.stats[q.id]; return s && s.last === 1; }).length;
    var seen = qs.filter(function (q) { return data.stats[q.id]; }).length;
    return { total: qs.length, good: good, seen: seen };
  }

  /* ---------------- home ---------------- */
  function home() {
    S = null;
    var all = mastery(), missed = QUESTIONS.filter(function (q) { var s = data.stats[q.id]; return s && s.last === 0; });
    var h = '<h1>Quiz</h1><p class="lead">' + QUESTIONS.length + " questions on the project, " + CARDS.length + " oral-drill cards. Wrong answers come back until you know them.</p>";
    h += '<div class="kpi"><div><b>' + all.good + " / " + all.total + "</b><span>questions you last got right</span></div><div><b>" + all.seen + '</b><span>questions seen</span></div><div><b>' +
      (data.best.exam != null ? data.best.exam + "%" : "-") + "</b><span>best mock exam</span></div></div>";
    h += '<div class="big"><button class="btn" id="b-exam" type="button">Mock exam (20 questions)</button>' +
      '<button class="btn alt" id="b-miss" type="button"' + (missed.length ? "" : " disabled") + ">Redo my mistakes (" + missed.length + ")</button>" +
      '<button class="btn alt" id="b-cards" type="button">Oral drill (' + CARDS.length + " cards)</button></div>";
    h += "<h3>Practice by topic</h3><div class=\"topics\">";
    TOPICS.forEach(function (t) {
      var m = mastery(t), pct = Math.round(100 * m.good / m.total);
      h += '<button class="topic" type="button" data-topic="' + esc(t) + '"><b>' + esc(t) + "</b><span>" + m.total + " questions &middot; " + m.good + " mastered</span><div class=\"meter\"><i style=\"width:" + pct + '%"></i></div></button>';
    });
    h += "</div>";
    h += '<p class="small muted">How it works: pick an answer, read the explanation, go on. Keys <kbd>1</kbd>-<kbd>4</kbd> choose, <kbd>Enter</kbd> or <kbd>Space</kbd> continues. Your progress stays in this browser only. <button class="link a" id="b-reset" type="button">Reset my progress</button></p>';
    $("app").innerHTML = h;
    $("b-exam").onclick = function () { start("Mock exam", shuffle(QUESTIONS).slice(0, 20), true); };
    $("b-miss").onclick = function () { start("My mistakes", shuffle(missed), false); };
    $("b-cards").onclick = cards;
    $("b-reset").onclick = function () { if (confirm("Erase your quiz progress in this browser?")) { data = { stats: {}, best: {} }; save(data); home(); } };
    document.querySelectorAll(".topic").forEach(function (b) {
      b.onclick = function () { start(b.dataset.topic, shuffle(QUESTIONS.filter(function (q) { return q.topic === b.dataset.topic; })), false); };
    });
  }

  /* ---------------- question session ---------------- */
  function start(title, list, isExam) {
    if (!list.length) { home(); return; }
    S = { mode: "q", title: title, list: list, i: 0, score: 0, missed: [], answered: false, exam: isExam, byTopic: {} };
    question();
  }
  function question() {
    var q = S.list[S.i];
    S.opts = shuffle([{ t: q.right, ok: true }].concat(q.wrong.map(function (w) { return { t: w, ok: false }; })));
    S.answered = false;
    var h = '<div class="qhead"><span>' + esc(S.title) + " &middot; " + (S.i + 1) + " / " + S.list.length + '</span><div class="prog"><i style="width:' + Math.round(100 * S.i / S.list.length) + '%"></i></div><span>' + esc(q.topic) + "</span></div>";
    h += '<div class="qtext">' + esc(q.q) + "</div>";
    S.opts.forEach(function (o, k) { h += '<button class="opt" type="button" data-k="' + k + '"><kbd>' + (k + 1) + "</kbd><span>" + esc(o.t) + "</span></button>"; });
    h += '<div id="fb"></div><p class="small"><button class="link a" id="b-quit" type="button">Quit to the menu</button></p>';
    $("app").innerHTML = h;
    document.querySelectorAll(".opt").forEach(function (b) { b.onclick = function () { choose(+b.dataset.k); }; });
    $("b-quit").onclick = home;
  }
  function choose(k) {
    if (S.answered) return;
    S.answered = true;
    var q = S.list[S.i], ok = S.opts[k].ok;
    var st = data.stats[q.id] || { right: 0, wrong: 0 };
    if (ok) { st.right++; S.score++; } else { st.wrong++; S.missed.push(q); }
    st.last = ok ? 1 : 0; data.stats[q.id] = st; save(data);
    var t = S.byTopic[q.topic] || (S.byTopic[q.topic] = { r: 0, n: 0 }); t.n++; if (ok) t.r++;
    document.querySelectorAll(".opt").forEach(function (b, idx) {
      b.disabled = true;
      if (S.opts[idx].ok) b.classList.add("right"); else if (idx === k) b.classList.add("wrong");
    });
    var last = S.i === S.list.length - 1;
    $("fb").innerHTML = '<div class="box ' + (ok ? "say" : "bad") + ' expl"><span class="tag">' + (ok ? "Correct" : "Not quite") + "</span><p>" + esc(q.why) + '</p></div><button class="btn" id="b-next" type="button">' + (last ? "See the result" : "Next question") + "</button>";
    $("b-next").onclick = next; $("b-next").focus();
  }
  function next() { if (S.i < S.list.length - 1) { S.i++; question(); } else result(); }

  function result() {
    var n = S.list.length, pct = Math.round(100 * S.score / n);
    if (S.exam) { data.best.exam = Math.max(pct, data.best.exam || 0); save(data); }
    var h = "<h1>" + esc(S.title) + " : result</h1><div class=\"score\">" + S.score + " / " + n + '</div><p class="lead">' + pct + "% &middot; " +
      (pct >= 85 ? "Excellent. Now do the oral drill." : pct >= 65 ? "Good. Redo the mistakes, then try again." : "Keep going: read the guide section for each missed topic, then redo this.") + "</p>";
    var topics = Object.keys(S.byTopic);
    if (topics.length > 1) {
      h += "<h3>By topic</h3>";
      topics.forEach(function (t) {
        var x = S.byTopic[t], p = Math.round(100 * x.r / x.n);
        h += '<div class="bar-row"><span>' + esc(t) + '</span><div class="meter"><i style="width:' + p + '%"></i></div><span>' + x.r + "/" + x.n + "</span></div>";
      });
    }
    if (S.missed.length) {
      h += "<h3>What you missed</h3>";
      S.missed.forEach(function (q) { h += '<div class="miss"><b>' + esc(q.q) + '</b><br><span class="a">' + esc(q.right) + "</span><br><span class=\"small muted\">" + esc(q.why) + "</span></div>"; });
    }
    h += '<div class="row2"><button class="btn" id="b-again" type="button">' + (S.missed.length ? "Redo the " + S.missed.length + " I missed" : "Back to the menu") + '</button><button class="btn alt" id="b-home" type="button">Menu</button></div>';
    $("app").innerHTML = h;
    var missed = S.missed;
    $("b-again").onclick = function () { if (missed.length) start("My mistakes", shuffle(missed), false); else home(); };
    $("b-home").onclick = home;
  }

  /* ---------------- oral drill ---------------- */
  function cards() {
    S = { mode: "c", queue: shuffle(CARDS.map(function (c, i) { return i; })), shown: false, done: 0 };
    card();
  }
  function card() {
    if (!S.queue.length) {
      $("app").innerHTML = '<h1>Oral drill : done</h1><p class="lead">You went through all ' + CARDS.length + ' cards. Say them again tomorrow morning, out loud.</p><div class="row2"><button class="btn" id="b-again" type="button">Again</button><button class="btn alt" id="b-home" type="button">Menu</button></div>';
      $("b-again").onclick = cards; $("b-home").onclick = home; return;
    }
    var c = CARDS[S.queue[0]]; S.shown = false;
    var h = '<div class="qhead"><span>Oral drill &middot; ' + S.done + " done, " + S.queue.length + ' left</span><div class="prog"><i style="width:' + Math.round(100 * S.done / (S.done + S.queue.length)) + '%"></i></div><span></span></div>';
    h += '<div class="card big-card"><span class="tpill">Say it out loud first</span><div class="qtext">' + esc(c[0]) + '</div><div id="ans"></div></div>';
    h += '<div class="row2" id="acts"><button class="btn" id="b-show" type="button">Show the answer</button><button class="btn alt" id="b-quit" type="button">Quit</button></div>';
    $("app").innerHTML = h;
    $("b-show").onclick = reveal; $("b-quit").onclick = home;
  }
  function reveal() {
    if (S.shown) return; S.shown = true;
    $("ans").innerHTML = '<div class="box say" style="margin:.5rem 0 0"><span class="tag">Model answer</span><p>' + esc(CARDS[S.queue[0]][1]) + "</p></div>";
    $("acts").innerHTML = '<button class="btn" id="b-got" type="button">I knew it</button><button class="btn alt" id="b-again" type="button">Not yet (ask me again)</button>';
    $("b-got").onclick = function () { S.queue.shift(); S.done++; card(); };
    $("b-again").onclick = function () { var c = S.queue.shift(); S.queue.push(c); card(); };
  }

  document.addEventListener("keydown", function (e) {
    if (!S || e.metaKey || e.ctrlKey || e.altKey) return;
    if (S.mode === "q") {
      if (!S.answered && /^[1-4]$/.test(e.key)) { choose(+e.key - 1); }
      else if (S.answered && (e.key === "Enter" || e.key === " " || e.key === "ArrowRight")) { e.preventDefault(); next(); }
    } else if (S.mode === "c" && S.queue.length && !S.shown && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); reveal(); }
  });

  window.__quiz = { count: QUESTIONS.length, cards: CARDS.length };
  home();
})();
</script>
</body>
</html>
